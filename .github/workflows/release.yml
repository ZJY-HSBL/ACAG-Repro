name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Verify archived results can be reproduced
        run: |
          python tools/benchmark.py --seeds 10 --budget 600 --population 20
          git diff --exit-code -- results/benchmark_v0.1.0.csv results/summary_v0.1.0.json docs/figures/
      - name: Release v0.1.0 after successful checks
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already published; keeping the release unchanged."
            exit 0
          fi
          gh release create v0.1.0 --target "$GITHUB_SHA" \
            --title 'v0.1.0 — Initial ACAG reproduction' \
            --notes-file docs/RELEASE_NOTES_v0.1.0.md
