name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing dependencies
        run: python -m pip install -e '.[test]'
      - name: Unit tests and exact evaluation accounting
        run: python -m pytest -q
      - name: Reproduce v0.2.0 seed-level experiment and all SVGs
        run: |
          python tools/ablation_v02.py --seed-start 100 --seeds 30 --budget 1000 --population 20
          git diff --exit-code -- results/ablation_v0.2.0.csv results/convergence_v0.2.0.csv results/summary_v0.2.0.json docs/figures/v0.2.0/
      - name: Assert generated artifacts are tracked
        run: |
          test "$(find docs/figures/v0.2.0 -name '*.svg' | wc -l)" -eq 6
          test "$(wc -l < results/ablation_v0.2.0.csv)" -eq 421
          test "$(wc -l < results/convergence_v0.2.0.csv)" -gt 700
      - name: Publish v0.2.0 only after successful checks
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already published; leaving release untouched."
            exit 0
          fi
          gh release create v0.2.0 --target "$GITHUB_SHA" \
            --title 'v0.2.0 — Counted-budget ACAG switch ablations' \
            --notes-file docs/RELEASE_NOTES_v0.2.0.md
